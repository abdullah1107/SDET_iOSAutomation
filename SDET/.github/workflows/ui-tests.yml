name: ios-login-test
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest   # use an image that has Xcode 27 / iOS 27 simulator
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/main.py
      - if: always()
        run: cat build/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            build/summary.md
            build/xcodebuild.log
            build/Result.xcresult
